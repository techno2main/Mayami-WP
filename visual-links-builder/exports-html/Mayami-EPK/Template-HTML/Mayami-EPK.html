<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Links Builder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: #f5f5f5; }
    .wrapper { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .pdf-cta-preview { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 auto 16px; text-align: center; font-family: Arial, sans-serif; font-size: 14px; line-height: 1.35; font-weight: 700; letter-spacing: 0.2px; }
    .pdf-cta-preview__label { display: inline-block; border: 1px solid currentColor; border-radius: 4px; padding: 2px 6px; font-size: 11px; line-height: 1; font-weight: 800; text-transform: uppercase; }
    .pdf-cta-preview__text { color: inherit; text-decoration: none; }
    .pdf-cta-preview.active { color: #dc2626; }
    .pdf-cta-preview.active .pdf-cta-preview__text { text-decoration: underline; }
    .pdf-cta-preview.inactive { color: #94a3b8; }
    .img-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .img-wrap { position: relative; }
    #mapImg { display: block; width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <main class="wrapper">
    <div class="pdf-cta-preview active">
      <span class="pdf-cta-preview__label">PDF</span>
      <a href="https://ellenemasri.pro/wp-content/uploads/2026/06/MAYAMI-ONESHEET-CLICKABLE.pdf" target="_blank" rel="noopener noreferrer" class="pdf-cta-preview__text">DOWNLOAD THIS MAYAMI ONESHEET - CLICKABLE IN PDF</a>
    </div>
    <div class="img-card">
      <div class="img-wrap">
        <img id="mapImg" src="https://ellenemasri.pro/wp-content/uploads/2026/06/Mayami-EPK-11.jpeg" usemap="#imageMap1780419062303" alt="Visual link layout">
      </div>
      <map name="imageMap1780419062303">
        <area shape="rect" coords="580,855,639,916" href="https://open.spotify.com/track/3rzrziofCOwRrI1r99IUbQ?si=d7206901b5cc4e7c" target="_blank" rel="noopener noreferrer" alt="">
        <area shape="rect" coords="643,855,712,917" href="https://music.apple.com/us/album/mayami-my-miami/6771742498?i=6771742499" target="_blank" rel="noopener noreferrer" alt="">
        <area shape="rect" coords="718,855,796,917" href="https://www.youtube.com/watch?v=SZjsiB35EKI" target="_blank" rel="noopener noreferrer" alt="">
        <area shape="rect" coords="801,855,907,918" href="https://music.amazon.com/albums/B0H2FQLH4N?marketplaceId=ATVPDKIKX0DER&amp;musicTerritory=US&amp;ref=dm_sh_1mSu3fYfppIc8cCAVnvIsbb0Z&amp;trackAsin=B0H2FR3WHQ" target="_blank" rel="noopener noreferrer" alt="">
        <area shape="rect" coords="257,1374,430,1412" href="tel:+13057446688" target="_blank" rel="noopener noreferrer" alt="">
        <area shape="rect" coords="440,1374,666,1412" href="mailto:contact@ellenemasri.com" target="_blank" rel="noopener noreferrer" alt="">
        <area shape="rect" coords="670,1374,859,1412" href="http://www.ellenemasri.com/" target="_blank" rel="noopener noreferrer" alt="">
      </map>
    </div>
  </main>
  
  <script>
    (function () {
      var img = document.getElementById('mapImg');
      var map = document.querySelector('map[name="imageMap1780419062303"]');
      if (!img || !map) return;
      var areas = Array.from(map.querySelectorAll('area'));
      var origCoords = areas.map(function (a) { return (a.getAttribute('coords') || '').split(',').map(Number); });
      var naturalW = 940;
      function rescale() {
        var displayW = img.offsetWidth;
        if (!displayW) return;
        var ratio = displayW / naturalW;
        areas.forEach(function (area, i) {
          var c = origCoords[i];
          if (c && c.length === 4) {
            area.setAttribute('coords', [
              Math.round(c[0] * ratio),
              Math.round(c[1] * ratio),
              Math.round(c[2] * ratio),
              Math.round(c[3] * ratio)
            ].join(','));
          }
        });
      }
      if (img.complete) rescale(); else img.addEventListener('load', rescale);
      window.addEventListener('resize', rescale);
    })();
    </script>
</body>
</html>
