<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Links Builder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f4f6;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #0f172a;
      padding: 24px;
      overflow-x: auto;
    }
    .wrapper {
            width: 940px;
            max-width: 100%;
            margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #d7dce8;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      padding: 14px;
    }
    .anchor-section {
      max-width: 860px;
      margin: 20px auto 0;
      background: #fff;
      border: 1px solid #d7dce8;
      border-radius: 10px;
      padding: 16px;
    }
    .anchor-section h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #0f172a;
    }
    .anchor-section p {
      margin: 0;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="wrapper">
